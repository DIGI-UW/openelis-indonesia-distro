worker_processes 1;

events { worker_connections 1024; }
http {
    # Catch-all HTTP-01 challenge server so hostname additions stay compose-driven.
    server {
        listen [::]:80;
        listen 80;
        server_name _;

        # ^~ ensures this wins over location / (nginx 1.15 prefix matching)
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default_server;
        # Host routing is generic here; certificate SANs are driven by compose env vars.
        server_name _ localhost;
        # server_name indonesiadev.openelis-global.org;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

       # ssl_certificate /etc/letsencrypt/live/indonesiadev.openelis-global.org/fullchain.pem;
       # ssl_certificate_key /etc/letsencrypt/live/indonesiadev.openelis-global.org/privkey.pem;
       absolute_redirect off;

        location / {
            proxy_pass http://frontend.openelis.org;
            proxy_redirect     off;
        }

        location /api/ {
            proxy_pass         https://oe.openelis.org:8443/api/;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }
    }

    # Analyzer bridge upload UI. SNI/Host routes any `bridge.*` hostname here
    # (bridge.localhost, bridge.mgdev.*, bridge.mgtest.*, …); every other host
    # falls through to the default_server above (the frontend). Generalizes the
    # single-host block from distro #16 so it works on any deployment without
    # editing server_name. The bridge speaks self-signed TLS + HTTP Basic Auth
    # (OE admin creds via BRIDGE_SECURITY_* on the openelis-analyzer-bridge
    # service). Bridge "/" is POST-only and Spring does not auto-resolve
    # /admin/upload/ -> index.html, so redirect the common entry points.
    server {
        listen [::]:443 ssl;
        listen 443 ssl;
        server_name ~^bridge\.;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        absolute_redirect off;

        location = /              { return 301 /admin/upload/index.html; }
        location = /admin/upload  { return 301 /admin/upload/index.html; }
        location = /admin/upload/ { return 301 /admin/upload/index.html; }

        location / {
            proxy_pass         https://bridge.openelis.org:8443;
            proxy_redirect     off;
            proxy_ssl_verify   off;
            proxy_ssl_server_name on;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 32m;  # result spreadsheets (.xlsx/.ods) can be large
        }
    }
}
